<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Status Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root{
      --red:#e60012;
      --orange:#fb8c00;
      --green:#00a65a;
      --grey:#8f98a5;
      --blue:#2563eb;
      --text:#111827;
      --muted:#667085;
      --line:#d9dee8;
      --soft:#f7f9fc;
      --white:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#fff;
      color:var(--text);
      font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
      font-size:14px;
    }
    .app{
      width:100%;
      max-width:1440px;
      margin:0 auto;
      padding:18px 22px 36px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      margin-bottom:16px;
    }
    h1{
      margin:0;
      font-size:30px;
      line-height:1.15;
      font-weight:900;
      letter-spacing:-.4px;
    }
    .last-updated{
      margin-top:8px;
      color:var(--muted);
      font-size:14px;
    }
    .btn{
      border:1px solid var(--blue);
      background:var(--blue);
      color:#fff;
      border-radius:8px;
      padding:11px 18px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      line-height:1;
      white-space:nowrap;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn.secondary{
      background:#fff;
      color:var(--blue);
    }
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }
    .btn.light{
      background:#f3f6fb;
      color:#344054;
      border-color:#cfd7e6;
    }
    .load-area{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:12px;
      flex-wrap:wrap;
    }
    .file-upload-card{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px;
      border:1px solid #d9e1ef;
      border-radius:14px;
      background:#f8fbff;
      box-shadow:0 2px 8px rgba(16,24,40,.06);
      transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .file-upload-card.dragover{
      border-color:var(--blue);
      background:#eef4ff;
      box-shadow:0 0 0 4px rgba(37,99,235,.12);
    }
    .file-upload-card input[type=file]{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    .file-drop{
      min-width:360px;
      min-height:58px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:10px 14px;
      border:1px dashed #b7c5d9;
      border-radius:12px;
      background:#fff;
      cursor:pointer;
      transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .file-drop:hover{
      border-color:var(--blue);
      background:#f5f9ff;
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }
    .file-icon{
      width:36px;
      height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:9px;
      background:#eef4ff;
      font-size:16px;
    }
    .file-text{
      display:flex;
      flex-direction:column;
      gap:3px;
      line-height:1.1;
    }
    .file-text strong{
      font-size:14px;
      color:#1d2939;
    }
    .file-text em{
      font-style:normal;
      font-size:12px;
      color:#667085;
      max-width:280px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .file-load-btn{
      padding-left:14px;
      padding-right:14px;
    }
    .summary-card{
      border:1px solid var(--line);
      border-radius:10px;
      padding:20px 24px;
      margin-bottom:18px;
      background:#fff;
    }
    .summary-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:16px;
    }
    .summary-title{
      font-size:19px;
      font-weight:900;
    }
    .summary-title span{
      color:#475467;
      font-weight:800;
    }
    .total-model{
      text-align:right;
      color:var(--blue);
      font-weight:800;
      min-width:150px;
    }
    .total-model .num{
      display:block;
      margin-top:10px;
      font-size:30px;
      line-height:1;
    }
    .summary-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(130px,1fr));
      gap:14px;
      max-width:1120px;
    }
    .status-chip{
      min-height:50px;
      border:1px solid #e2e7f0;
      border-radius:9px;
      padding:12px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
      box-shadow:0 1px 2px rgba(16,24,40,.03);
    }
    .status-chip .label{
      display:flex;
      align-items:center;
      gap:8px;
      color:#475467;
      font-weight:600;
    }
    .status-chip .count{
      font-size:18px;
      font-weight:900;
      color:#111827;
    }
    .dot{
      width:13px;
      height:13px;
      border-radius:50%;
      display:inline-block;
      vertical-align:middle;
      flex:none;
      border:1px solid rgba(0,0,0,.08);
    }
    .dot.red{background:var(--red)}
    .dot.orange{background:var(--orange)}
    .dot.green{background:var(--green)}
    .dot.grey{background:var(--grey)}
    .dot.blue{background:var(--blue)}
    .dot.none{background:var(--blue)}

    .filter-panel{
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid #e5eaf3;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }
    .filter-help{
      color:#667085;
      font-size:13px;
      line-height:1.35;
    }
    .filter-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .country-dropdown{
      position:relative;
      min-width:280px;
    }
    .country-dropdown-btn{
      width:100%;
      min-height:42px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:#111827;
      padding:10px 38px 10px 12px;
      font-size:14px;
      font-weight:800;
      text-align:left;
      cursor:pointer;
      position:relative;
    }
    .country-dropdown-btn::after{
      content:'';
      position:absolute;
      right:14px;
      top:50%;
      width:8px;
      height:8px;
      border-right:2px solid #667085;
      border-bottom:2px solid #667085;
      transform:translateY(-65%) rotate(45deg);
    }
    .country-dropdown-menu{
      display:none;
      position:absolute;
      top:48px;
      left:0;
      z-index:100;
      width:360px;
      max-height:340px;
      overflow:auto;
      padding:10px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      box-shadow:0 12px 28px rgba(16,24,40,.16);
    }
    .country-dropdown.open .country-dropdown-menu{
      display:block;
    }
    .region-group{
      margin-bottom:10px;
    }
    .region-group:first-child .region-title{border-top: 0;}
    .region-title{
      margin:8px 4px 6px;
      color:#344054;
      font-size:12px;
      font-weight:900;
      display:flex;
      align-items:center;
      gap:4px;
      padding-top: 5px;
      border-top: 1px solid var(--line);
    }
    .region-check{
      width:15px;
      height:15px;
      cursor:pointer;
      accent-color:var(--blue);
    }
    .country-option{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 4px;
      color:#111827;
      font-size:13px;
      cursor:pointer;
      border-radius:6px;
      margin-left: 10px;
    }
    .country-option:hover{
      background:#f5f9ff;
    }
    .country-option input{
      width:15px;
      height:15px;
      accent-color:var(--blue);
      cursor:pointer;
    }
    .filter-actions .btn{
      min-height:42px;
    }

    .matrix-card,
    .detail-card{
      border:1px solid var(--line);
      border-radius:8px;
      background:#fff;
      overflow:hidden;
      margin-bottom:18px;
    }
    .matrix-wrap{
      overflow:auto;
      max-height:500px;
    }
    table{
      border-collapse:collapse;
      width:100%;
      font-size:14px;
    }
    th,td{
      border:1px solid var(--line);
      padding:10px 14px;
      line-height:1.2;
    }
    th{
      background:#fbfcff;
      font-weight:900;
      text-align:center;
    }
    th.model,
    td.model{
      text-align:left;
      min-width:420px;
      max-width:520px;
      white-space:normal;
    }
    th.country{
      min-width:126px;
      cursor:pointer;
      transition:background .15s ease,color .15s ease;
    }
    th.country:hover,
    th.country.active{
      background:#eef4ff;
      color:var(--blue);
    }
    td.status-cell{
      text-align:center;
      height:40px;
    }
    .hint{
      color:#475467;
      font-size:14px;
      margin:22px 2px 14px;
    }
    .detail-card{
      display:none;
      padding:0;
    }
    .detail-card.show{
      display:block;
      background:#fff;
    }
    .detail-head{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      padding:16px 18px 12px;
      border-bottom:1px solid var(--line);
    }
    .detail-title{
      font-size:20px;
      font-weight:900;
      margin:0 0 10px;
    }
    .mini-summary{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
      color:#475467;
      font-size:14px;
    }
    .mini-summary span{
      display:inline-flex;
      align-items:center;
      gap:7px;
      white-space:nowrap;
    }
    .detail-scroll{
      max-height:460px;
      overflow:auto;
    }
    .detail-table th,
    .detail-table td{
      padding:8px 14px;
    }
    .detail-table th.status,
    .detail-table td.status{
      min-width:420px;
      text-align:left;
    }
    .detail-table th.pg-col,
    .detail-table td.pg-col{
      min-width:90px;
      width:90px;
      text-align:center;
      white-space:nowrap;
    }
    .status-inline{
      display:inline-flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
      margin-right:14px;
    }
    .status-stack{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px 4px;
    }
    .empty{
      border:1px dashed var(--line);
      background:#fafafa;
      color:#667085;
      padding:34px;
      text-align:center;
      border-radius:10px;
      margin-top:18px;
    }
    .tooltip{
      position:relative;
    }
    .tooltip:hover::after{
      content:attr(data-tip);
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom:125%;
      background:#111827;
      color:#fff;
      border-radius:8px;
      padding:8px 10px;
      font-size:12px;
      line-height:1.35;
      min-width:230px;
      white-space:pre-line;
      z-index:50;
      text-align:left;
      box-shadow:0 8px 18px rgba(0,0,0,.18);
    }
    @media(max-width:900px){
      .topbar,.summary-head,.detail-head{flex-direction:column}
      .load-area{justify-content:flex-start}
      .summary-grid{grid-template-columns:1fr 1fr}
      th.model,td.model{min-width:280px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <h1>Request Status Dashboard</h1>
        <div class="last-updated" id="lastUpdated">Last updated: -</div>
      </div>
      <div class="load-area">
        <div class="file-upload-card" id="dropZone">
          <label class="file-drop" for="fileInput">
            <span class="file-icon">📎</span>
            <span class="file-text">
              <strong>Select or drag and drop an Excel/CSV file</strong>
              <em id="fileName">Drop .xlsx / .xlsb / .xls / .csv file here</em>
            </span>
          </label>
          <input id="fileInput" type="file" accept=".xlsx,.xlsb,.xls,.csv" />
          <button class="btn file-load-btn" type="button" onclick="loadExcelFile()">Load</button>
        </div>
      </div>
    </div>

    <div id="dashboard">
      <div class="empty">Select or drag and drop an Excel/CSV file, then click “Load File” to generate the dashboard.</div>
    </div>
  </div>

<script>

const today = new Date();
today.setHours(0,0,0,0);

let currentRows = [];
let selectedCountry = null;
let selectedMatrixCountries = [];

const COLORS = { Red:'red', Orange:'orange', Green:'green', Grey:'grey', None:'blue' };
const PRIORITY = { Red:5, Orange:4, Green:3, Grey:2, None:1 };

const aliasMap = {
  model:['model name','model','content','contents'],
  country:['project name','project','project_name','country','country/region','nation','market'],
  region:['region','region group','area','continent'],
  task:['task status in ptt','task status','status in ptt'],
  pttSubmit:['ptt submit date','ptt submission date'],
  actualStaging:['actual staging date','actual stg date'],
  submission:['submission date'],
  ldmApproval:["ldm's approval date",'ldm approval date','ldm approval'],
  lastComment:['last comment date','last comment'],
  liveUrl:['live url','liveurl'],
  pg:['pg#','pg','page#','page no','page number']
};

function norm(v){ return String(v ?? '').trim(); }
function key(s){ return norm(s).toLowerCase().replace(/[\s_\-]+/g,' ').replace(/[’']/g,"'"); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function isNA(v){
  const s = norm(v).toLowerCase();
  return !s || ['n/a','na','#n/a','-','tbd','null','none'].includes(s);
}
function parseDate(v){
  if(v instanceof Date && !isNaN(v)){
    const d = new Date(v); d.setHours(0,0,0,0); return d;
  }
  if(typeof v === 'number' && v > 20000 && window.XLSX){
    const parsed = XLSX.SSF.parse_date_code(v);
    if(parsed) return new Date(parsed.y, parsed.m - 1, parsed.d);
  }
  const s = norm(v);
  if(isNA(s)) return null;
  const cleaned = s.replace(/\./g,'/').replace(/-/g,'/');
  const m = cleaned.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if(m){
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    d.setHours(0,0,0,0);
    return d;
  }
  const d = new Date(s);
  if(!isNaN(d)){ d.setHours(0,0,0,0); return d; }
  return null;
}
function ageDays(v){
  const d = parseDate(v);
  if(!d) return null;
  return Math.floor((today - d) / 86400000);
}
function formatProjectCountry(v){
  const s = norm(v);
  const m = s.match(/^LGE\s+(.+?)\s*-\s*(.+?)\s*\((.*?)\)\s*$/i);
  if(m){
    const project = m[1].trim().replace(/^LGE\s+/i,'');
    const country = m[2].trim();
    return `${country} (${project})`;
  }
  return s;
}
function findColumn(headers, aliases){
  const hmap = new Map(headers.map(h => [key(h), h]));
  for(const a of aliases){
    if(hmap.has(key(a))) return hmap.get(key(a));
  }
  return null;
}
function arrayToObjects(rows){
  if(!Array.isArray(rows) || !rows.length) return [];
  const headerIndex = rows.findIndex(row => row && row.some(cell => key(cell) === 'model name') && row.some(cell => key(cell) === 'project' || key(cell) === 'project name'));
  const headers = (headerIndex >= 0 ? rows[headerIndex] : rows[0]).map(h => norm(h));
  const dataRows = rows.slice((headerIndex >= 0 ? headerIndex : 0) + 1);
  return dataRows
    .filter(row => row && row.some(v => norm(v)))
    .map(row => {
      const obj = {};
      headers.forEach((h,i) => obj[h || `Column${i+1}`] = row[i] ?? '');
      return obj;
    });
}
function mapRows(rows){
  const headers = Object.keys(rows[0] || {});
  const col = {};
  Object.entries(aliasMap).forEach(([k,a]) => col[k] = findColumn(headers,a));
  const data = rows.map(r => Object.fromEntries(Object.entries(col).map(([k,c]) => [k, c ? r[c] : ''])));
  return { col, data };
}
function statusFor(r){
  const task = norm(r.task);
  if(!isNA(r.liveUrl)) return { signal:'Green', title:'Closed', aging:'', reason:'Live URL exists' };
  if(task === '[WPL] Cancelled') return { signal:'Grey', title:'Cancelled', aging:'', reason:'Task Status = [WPL] Cancelled' };

  const pttAge = ageDays(r.pttSubmit);
  const subAge = ageDays(r.submission);
  const commentAge = ageDays(r.lastComment);

  if(pttAge !== null && pttAge >= 14 && isNA(r.actualStaging)) return { signal:'Red', title:'Pre-check', aging:pttAge, reason:'PTT submit date is 14+ days old and Actual staging date is N/A' };
  if(task === '[WPL] Client Review' && subAge !== null && subAge >= 14 && isNA(r.ldmApproval)) return { signal:'Red', title:'Client-Review', aging:subAge, reason:'Submission Date is 14+ days old and LDM approval date is N/A' };
  if(task === '[WPL] Request Clarification' && commentAge !== null && commentAge >= 14) return { signal:'Red', title:'Request Clarification', aging:commentAge, reason:'Last comment date is 14+ days old' };

  if(pttAge !== null && pttAge >= 7 && isNA(r.actualStaging)) return { signal:'Orange', title:'Pre-check', aging:pttAge, reason:'PTT submit date is 7+ days old and Actual staging date is N/A' };
  if(task === '[WPL] Client Review' && subAge !== null && subAge >= 7 && isNA(r.ldmApproval)) return { signal:'Orange', title:'Client-Review', aging:subAge, reason:'Submission Date is 7+ days old and LDM approval date is N/A' };
  if(task === '[WPL] Request Clarification' && commentAge !== null && commentAge >= 7) return { signal:'Orange', title:'Request Clarification', aging:commentAge, reason:'Last comment date is 7+ days old' };

  return { signal:'None', title:'', aging:'', reason:'No matching condition' };
}
function worse(a,b){ return PRIORITY[b.signal] > PRIORITY[a.signal] ? b : a; }

function prepareData(rows){
  const { col, data } = mapRows(rows);
  const missing = Object.entries({ 'Model Name':col.model, 'Project Name/Project':col.country, 'Task Status in PTT':col.task })
    .filter(([,v]) => !v).map(([k]) => k);
  if(missing.length) throw new Error('Required columns were not found: ' + missing.join(', '));

  return data
    .map((r,i) => ({
      ...r,
      idx:i+1,
      model:norm(r.model),
      pg:norm(r.pg),
      country:formatProjectCountry(r.country),
      region:norm(r.region) || 'Other',
      status:statusFor(r)
    }))
    .filter(r => r.model && r.country);
}
function buildCounts(rows){
  const counts = { Red:0, Orange:0, Green:0, Grey:0, None:0 };
  rows.forEach(r => counts[r.status.signal]++);
  return counts;
}
function statusChip(label, signal, count){
  return `<div class="status-chip"><span class="label"><i class="dot ${COLORS[signal]}"></i>${label}</span><span class="count">${count}</span></div>`;
}
function renderDashboard(rows, clickedCountry=null){
  let enriched;
  try{
    enriched = prepareData(rows);
  }catch(e){
    document.getElementById('dashboard').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    return;
  }

  selectedCountry = clickedCountry;
  const allCountries = [...new Set(enriched.map(r => r.country))].sort();

  // Keep only valid selected countries. Empty selection means "show all".
  selectedMatrixCountries = selectedMatrixCountries.filter(c => allCountries.includes(c));
  const visibleCountries = selectedMatrixCountries.length ? selectedMatrixCountries : allCountries;

  const visibleRows = enriched.filter(r => visibleCountries.includes(r.country));
  const models = [...new Set(visibleRows.map(r => r.model))].sort();

  const matrix = {};
  const countryRows = {};
  visibleRows.forEach(r => {
    matrix[r.model] ??= {};
    countryRows[r.country] ??= [];
    countryRows[r.country].push(r);
    matrix[r.model][r.country] = matrix[r.model][r.country] ? worse(matrix[r.model][r.country], r.status) : {...r.status};
  });

  const counts = buildCounts(visibleRows);
  const totalModel = models.length;

  // Build dropdown checkbox options grouped by Region from Row Data.
  const regionMap = {};
  enriched.forEach(r => {
    const region = norm(r.region) || 'Other';
    regionMap[region] ??= new Set();
    regionMap[region].add(r.country);
  });

  const dropdownLabel = selectedMatrixCountries.length
    ? `Country Selection (${selectedMatrixCountries.length})`
    : 'Country Selection';

  const dropdownGroups = Object.keys(regionMap).sort().map(region => {
    const options = Array.from(regionMap[region]).sort().map(country => `
      <label class="country-option">
        <input type="checkbox" class="country-check" value="${esc(country)}" ${selectedMatrixCountries.includes(country) ? 'checked' : ''}>
        <span>${esc(country)}</span>
      </label>
    `).join('');

    return `
      <div class="region-group">
        <label class="region-title">
          <input type="checkbox" class="region-check" data-region="${esc(region)}">
          <span>${esc(region)}</span>
        </label>
        ${options}
      </div>
    `;
  }).join('');

  let html = `
    <div id="captureArea">
      <section class="summary-card">
        <div class="summary-head">
          <div>
            <div class="summary-title">Overall Status <span>(All Countries)</span></div>
          </div>
          <div class="total-model">Total Request<span class="num">${totalModel}</span></div>
        </div>
        <div class="summary-grid">
          ${statusChip('14+ days','Red',counts.Red)}
          ${statusChip('7+ days','Orange',counts.Orange)}
          ${statusChip('Closed','Green',counts.Green)}
          ${statusChip('Cancelled','Grey',counts.Grey)}
        </div>

        <div class="filter-panel">
          <div class="filter-help">
            Click a country name to view detailed status.
          </div>
          <div class="filter-actions">
            <div class="country-dropdown" id="countryDropdown">
              <button class="country-dropdown-btn" type="button" id="countryDropdownBtn">${dropdownLabel}</button>
              <div class="country-dropdown-menu" id="countryDropdownMenu">
                ${dropdownGroups}
              </div>
            </div>
            <button class="btn light" type="button" id="applyCountryFilter">Apply</button>
            <button class="btn light" type="button" id="clearCountryFilter">Reset</button>
          </div>
        </div>
      </section>

      <section class="matrix-card">
        <div class="matrix-wrap">
          <table>
            <thead>
              <tr>
                <th class="model">Request Name</th>
                ${visibleCountries.map(c => `
                  <th class="country ${c===clickedCountry?'active':''}" data-country="${esc(c)}">
                    ${esc(c).replace(' (','<br>(')}
                  </th>
                `).join('')}
              </tr>
            </thead>
            <tbody>
              ${models.map(m => `
                <tr>
                  <td class="model">${esc(m)}</td>
                  ${visibleCountries.map(c => {
                    const s = matrix[m]?.[c] || {signal:'None', title:'', reason:'No data'};
                    if(s.signal === 'None'){
                      return `<td class="status-cell"></td>`;
                    }
                    const tip = `${s.title || ''}\n${s.reason || ''}\nCountry: ${c}\nModel: ${m}${s.aging!=='' && s.aging!==undefined ? `\nAging: ${s.aging} days` : ''}`;
                    return `<td class="status-cell tooltip" data-tip="${esc(tip)}"><i class="dot ${COLORS[s.signal]}"></i></td>`;
                  }).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </section>

      ${clickedCountry && visibleCountries.includes(clickedCountry) ? renderCountryDetail(clickedCountry, countryRows[clickedCountry] || []) : ''}
    </div>
  `;

  if(!clickedCountry || !visibleCountries.includes(clickedCountry)){
    html += `<div class="empty">Click a country name to display detailed status below.</div>`;
  }

  document.getElementById('dashboard').innerHTML = html;

  const dropdown = document.getElementById('countryDropdown');
  const dropdownBtn = document.getElementById('countryDropdownBtn');
  if(dropdownBtn && dropdown){
    dropdownBtn.addEventListener('click', e => {
      e.stopPropagation();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', e => {
      if(!dropdown.contains(e.target)){
        dropdown.classList.remove('open');
      }
    }, { once:true });
  }

  document.getElementById('applyCountryFilter').addEventListener('click', e => {
    e.stopPropagation();
    selectedMatrixCountries = Array.from(document.querySelectorAll('.country-check:checked')).map(input => input.value);
    const nextClickedCountry = selectedMatrixCountries.includes(selectedCountry) ? selectedCountry : null;
    renderDashboard(currentRows, nextClickedCountry);
  });

  document.getElementById('clearCountryFilter').addEventListener('click', e => {
    e.stopPropagation();
    selectedMatrixCountries = [];
    renderDashboard(currentRows, null);
  });

  document.querySelectorAll('.region-check').forEach(regionInput => {
    const regionGroup = regionInput.closest('.region-group');
    const countryInputs = Array.from(regionGroup.querySelectorAll('.country-check'));

    const syncRegionState = () => {
      const checkedCount = countryInputs.filter(input => input.checked).length;
      regionInput.checked = checkedCount === countryInputs.length && countryInputs.length > 0;
      regionInput.indeterminate = checkedCount > 0 && checkedCount < countryInputs.length;
    };

    syncRegionState();

    regionInput.addEventListener('change', e => {
      e.stopPropagation();
      countryInputs.forEach(input => input.checked = regionInput.checked);
      regionInput.indeterminate = false;
    });

    countryInputs.forEach(input => {
      input.addEventListener('change', syncRegionState);
    });
  });


  document.querySelectorAll('th.country').forEach(th => {
    th.addEventListener('click', () => renderDashboard(currentRows, th.dataset.country));
  });
}
function renderCountryDetail(country, rows){
  const counts = buildCounts(rows);

  const groupedMap = new Map();

  rows.forEach(r => {
    const model = norm(r.model);
    if(!groupedMap.has(model)){
      groupedMap.set(model, {
        model,
        totalPg: 0,
        statusGroups: {}
      });
    }

    const group = groupedMap.get(model);
    const pgNum = Number(String(r.pg || '').replace(/,/g, '').trim());
    if(!isNaN(pgNum)) group.totalPg += pgNum;

    const statusKey = r.status.signal + '|' + r.status.title;
    if(!group.statusGroups[statusKey]){
      group.statusGroups[statusKey] = {
        signal: r.status.signal,
        title: r.status.title,
        pg: 0,
        count: 0
      };
    }

    group.statusGroups[statusKey].count += 1;
    if(!isNaN(pgNum)) group.statusGroups[statusKey].pg += pgNum;
  });

  const groupedRows = Array.from(groupedMap.values()).map(group => {
    const statusList = Object.values(group.statusGroups)
      .filter(s => s.signal !== 'None')
      .sort((a,b) => PRIORITY[b.signal] - PRIORITY[a.signal] || a.title.localeCompare(b.title));

    const highestPriority = statusList.length ? Math.max(...statusList.map(s => PRIORITY[s.signal])) : 0;

    return {
      ...group,
      statusList,
      highestPriority
    };
  }).sort((a,b) => b.highestPriority - a.highestPriority || a.model.localeCompare(b.model));

  const formatNumber = value => value ? value.toLocaleString() : '';

  return `
    <section id="countryDetail" class="detail-card show">
      <div class="detail-head">
        <div>
          <h2 class="detail-title">${esc(country)} Detailed Status</h2>
          <div class="mini-summary">
            <span><i class="dot red"></i>Red <b>${counts.Red}</b></span>
            <span><i class="dot orange"></i>Orange <b>${counts.Orange}</b></span>
            <span><i class="dot green"></i>Green <b>${counts.Green}</b></span>
            <span><i class="dot grey"></i>Cancelled <b>${counts.Grey}</b></span>
          </div>
        </div>
        <button class="btn secondary download-image-btn" type="button" onclick="downloadCountryImage()">↓ ${esc(country)} Download Image</button>
      </div>
      <div class="detail-scroll">
        <table class="detail-table">
          <thead>
            <tr>
              <th class="model">Model Name</th>
              <th class="pg-col">Page#</th>
              <th class="status">Status</th>
            </tr>
          </thead>
          <tbody>
            ${groupedRows.map(group => `
              <tr>
                <td class="model">${esc(group.model)}</td>
                <td class="pg-col">${formatNumber(group.totalPg)}</td>
                <td class="status">
                  <div class="status-stack">
                    ${group.statusList.map(s => `
                      <span class="status-inline">
                        <i class="dot ${COLORS[s.signal]}"></i>${esc(s.title)}(${formatNumber(s.pg)})
                      </span>
                    `).join('')}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </section>
  `;
}

function parseCSV(text){
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i], next = text[i+1];
    if(ch === '"' && inQuotes && next === '"'){ cell += '"'; i++; }
    else if(ch === '"'){ inQuotes = !inQuotes; }
    else if(ch === ',' && !inQuotes){ row.push(cell); cell = ''; }
    else if((ch === '\n' || ch === '\r') && !inQuotes){
      if(ch === '\r' && next === '\n') i++;
      row.push(cell);
      if(row.some(v => norm(v))) rows.push(row);
      row = []; cell = '';
    }else{
      cell += ch;
    }
  }
  if(cell || row.length){
    row.push(cell);
    if(row.some(v => norm(v))) rows.push(row);
  }
  return rows;
}

const fileInputEl = document.getElementById('fileInput');
if(fileInputEl){
  fileInputEl.addEventListener('change', () => {
    const nameEl = document.getElementById('fileName');
    if(nameEl){
      nameEl.textContent = fileInputEl.files && fileInputEl.files[0] ? fileInputEl.files[0].name : 'Drop .xlsx / .xlsb / .xls / .csv file here';
    }
  });
}

function fileToRows(file){
  return new Promise((resolve,reject) => {
    const isCsv = /\.csv$/i.test(file.name);

    const reader = new FileReader();

    reader.onload = e => {
      try{
        if(isCsv){
          const text = e.target.result;
          resolve(arrayToObjects(parseCSV(text)));
          return;
        }

        const wb = XLSX.read(e.target.result, { type:'array', cellDates:true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){
        reject(err);
      }
    };

    reader.onerror = reject;

    if(isCsv){
      reader.readAsText(file, 'utf-8');
    }else{
      reader.readAsArrayBuffer(file);
    }
  });
}

function setSelectedFile(file){
  if(!file) return;
  const allowed = /\.(xlsx|xlsb|xls|csv)$/i;
  if(!allowed.test(file.name)){
    alert('Only Excel or CSV files can be uploaded. (.xlsx / .xlsb / .xls / .csv)');
    return;
  }

  const fileInput = document.getElementById('fileInput');
  const dataTransfer = new DataTransfer();
  dataTransfer.items.add(file);
  fileInput.files = dataTransfer.files;

  const nameEl = document.getElementById('fileName');
  if(nameEl) nameEl.textContent = file.name;
}

const dropZone = document.getElementById('dropZone');
if(dropZone){
  ['dragenter','dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, e => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('dragover');
    });
  });

  ['dragleave','drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, e => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('dragover');
    });
  });

  dropZone.addEventListener('drop', e => {
    const file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    setSelectedFile(file);
  });
}

async function loadExcelFile(){
  const file = document.getElementById('fileInput').files[0];
  if(!file){ alert('Please select an Excel file.'); return; }
  try{
    currentRows = await fileToRows(file);
    selectedCountry = null;
    selectedMatrixCountries = [];
    document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date().toLocaleString('sv-SE');
    renderDashboard(currentRows, null);
  }catch(e){
    console.error(e);
    alert('An error occurred while reading the file.');
  }
}
async function downloadCountryImage(){
  if(!selectedCountry){
    alert('Please select a country first.');
    return;
  }

  const el = document.getElementById('countryDetail');
  if(!el){
    alert('No detailed status is available for the selected country.');
    return;
  }

  // Hide the download button only in the captured image.
  const downloadBtn = el.querySelector('.download-image-btn');
  const originalDisplay = downloadBtn ? downloadBtn.style.display : '';

  try{
    if(downloadBtn) downloadBtn.style.display = 'none';

    const canvas = await html2canvas(el, {
      scale:2,
      backgroundColor:'#ffffff',
      useCORS:true,
      scrollX:0,
      scrollY:-window.scrollY,
      windowWidth:document.documentElement.scrollWidth,
      windowHeight:document.documentElement.scrollHeight
    });

    const safeName = selectedCountry.replace(/[^a-z0-9._()-]+/gi,'_');
    const a = document.createElement('a');
    a.download = `status_dashboard_${safeName}_detail.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  }finally{
    if(downloadBtn) downloadBtn.style.display = originalDisplay;
  }
}
